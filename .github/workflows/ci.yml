name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # None of FRONTEND_API_KEY / BACKEND_API_URL / NEXT_PUBLIC_GOOGLE_CLIENT_ID
      # are required for the build itself to succeed (they're only read at
      # request time by src/app/api/proxy and src/app/reduxProvider.js) — real
      # values only need to be set in Vercel's env vars for the deployed app.
      - run: npm run build
